name: Release Kissopen Terminal
run-name: Release Kissopen Terminal v${{ inputs.version }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Stable semantic version without the leading v
                required: true
                type: string
            release_notes:
                description: Markdown change notes for the GitHub Release
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-kissopen-terminal
    cancel-in-progress: false

env:
    RELEASE_PACKAGE: kissopen-terminal
    RELEASE_TAG: kissopen-terminal-v${{ inputs.version }}
    RELEASE_VERSION: ${{ inputs.version }}

jobs:
    build:
        name: Verify and build the npm package
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Check out main
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Validate release inputs
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                      echo "Kissopen Terminal releases must be dispatched from main." >&2
                      exit 1
                  fi
                  if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Kissopen Terminal versions must be stable semantic versions without a leading v." >&2
                      exit 1
                  fi
                  if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
                      echo "Release notes must not be blank." >&2
                      exit 1
                  fi
                  git fetch origin main --tags
                  if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
                      echo "Kissopen Terminal releases must start from the current main branch." >&2
                      exit 1
                  fi
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                      echo "Tag $RELEASE_TAG already exists." >&2
                      exit 1
                  fi
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG already exists." >&2
                      exit 1
                  fi

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply the requested package version
              run: pnpm exec tsx scripts/setReleaseVersion.ts

            - name: Build workspace dependencies
              run: pnpm build

            - name: Run type checks
              run: pnpm --filter @kissopen/kissopen-terminal check

            - name: Run unit tests
              env:
                  HOME: ${{ runner.temp }}/kissopen-terminal-test-home
              run: |
                  mkdir -p "$HOME"
                  pnpm --filter @kissopen/kissopen-terminal test

            - name: Build the isolated terminal gym runtime
              run: pnpm build:gym

            - name: Enable Linux user namespaces for the isolated gym
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Prove inline Node.js embedding in a real terminal
              run: >-
                  pnpm --filter @kissopen/kissopen-terminal-gym-tests exec vitest run
                  tests/node_project_embeds_kissopen_terminal_inline.test.ts
                  tests/startup_displays_kissopen_terminal_logo_and_version.test.ts
                  tests/desktop_provider_is_available_without_home_override.test.ts

            - name: Pack the exact npm artifact
              shell: bash
              run: |
                  mkdir -p release-assets
                  pnpm --filter @kissopen/kissopen-terminal pack \
                      --pack-destination "$GITHUB_WORKSPACE/release-assets"
                  tarball="$(find release-assets -maxdepth 1 -name '*.tgz' -print -quit)"
                  if [[ -z "$tarball" ]]; then
                      echo "Kissopen Terminal did not produce an npm tarball." >&2
                      exit 1
                  fi
                  shasum -a 256 "$tarball" > "$tarball.sha256"
                  cp packages/kissopen-terminal/package.json release-assets/package.json

            - name: Recover an equivalent package already accepted by npm
              shell: bash
              run: |
                  python3 <<'PY'
                  import base64
                  import hashlib
                  import io
                  import json
                  import os
                  import tarfile
                  import urllib.error
                  import urllib.request
                  from pathlib import Path

                  version = os.environ["RELEASE_VERSION"]
                  url = f"https://registry.npmjs.org/@kissopen/kissopen-terminal/{version}"
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          metadata = json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          print("This version has not been published; using the new package.")
                          raise SystemExit(0)
                      raise
                  expected_url = f"https://registry.npmjs.org/@kissopen/kissopen-terminal/-/kissopen-terminal-{version}.tgz"
                  if metadata["dist"]["tarball"] != expected_url:
                      raise RuntimeError("Unexpected npm tarball URL")
                  with urllib.request.urlopen(expected_url, timeout=60) as response:
                      published = response.read()
                  integrity = "sha512-" + base64.b64encode(hashlib.sha512(published).digest()).decode()
                  if integrity != metadata["dist"]["integrity"]:
                      raise RuntimeError("The downloaded npm package failed its integrity check")

                  def contents(data):
                      result = {}
                      with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                          for member in archive:
                              if not member.isfile() or member.name in result:
                                  raise RuntimeError("Unexpected or duplicate npm archive entry")
                              content = archive.extractfile(member).read()
                              # pnpm may reorder resolved workspace dependencies between packs.
                              # All manifest values and every other file must remain identical.
                              if member.name == "package/package.json":
                                  content = json.loads(content)
                              result[member.name] = (member.mode, content)
                      return result

                  tarball, = Path("release-assets").glob("*.tgz")
                  if contents(tarball.read_bytes()) != contents(published):
                      raise RuntimeError("Published package contents differ from the build; choose a new version")
                  tarball.write_bytes(published)
                  Path(str(tarball) + ".sha256").write_text(hashlib.sha256(published).hexdigest() + "  " + str(tarball) + "\n")
                  print("Recovered the original npm bytes; the packed-package smoke test will verify them next.")
                  PY

            - name: Smoke test the packed package
              shell: bash
              run: |
                  tarball="$(find release-assets -maxdepth 1 -name '*.tgz' -print -quit)"
                  smoke_root="$RUNNER_TEMP/kissopen-terminal-smoke"
                  mkdir -p "$smoke_root"
                  pnpm --dir "$smoke_root" add "$GITHUB_WORKSPACE/$tarball"

                  package_version="$(node -p "require('$smoke_root/node_modules/@kissopen/kissopen-terminal/package.json').version")"
                  test "$package_version" = "$RELEASE_VERSION"
                  test "$("$smoke_root/node_modules/.bin/kissopen" --version)" = "KISSOPEN Terminal $RELEASE_VERSION"

                  cd "$smoke_root"
                  node --input-type=module <<'NODE'
                  const terminal = await import("@kissopen/kissopen-terminal");
                  if (typeof terminal.runKissopenTerminal !== "function") {
                      throw new Error("The packed package does not export runKissopenTerminal.");
                  }
                  NODE

            - name: Upload the npm artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: kissopen-terminal-npm-${{ inputs.version }}
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Publish npm and GitHub releases
        needs: build
        runs-on: ubuntu-24.04
        environment: npm
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Check out the verified commit
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Download the verified npm artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: kissopen-terminal-npm-${{ inputs.version }}
                  path: release-assets

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - name: Install an npm that speaks trusted publishing
              run: |
                  pnpm add --global npm@11.18.0
                  npm_cli="$(pnpm root --global)/npm/bin/npm-cli.js"
                  test "$(node "$npm_cli" --version)" = "11.18.0"
                  echo "NPM_CLI=$npm_cli" >> "$GITHUB_ENV"

            - name: Confirm the release target and npm package
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git fetch origin main --tags
                  if [[ "$(git rev-parse "$GITHUB_SHA")" != "$(git rev-parse origin/main)" ]]; then
                      echo "Main changed while Kissopen Terminal was building. Rerun the release from current main." >&2
                      exit 1
                  fi
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                      echo "Tag $RELEASE_TAG was created while this release was building." >&2
                      exit 1
                  fi
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG was created while this release was building." >&2
                      exit 1
                  fi
                  if ! node "$NPM_CLI" view @kissopen/kissopen-terminal name \
                      --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
                      echo "npm requires @kissopen/kissopen-terminal to exist before trusted publishing can be configured." >&2
                      echo "Publish a one-time placeholder as an npm owner, then configure release-kissopen-terminal.yml as its trusted publisher." >&2
                      echo "No release tag was created." >&2
                      exit 1
                  fi
                  published_integrity="$(node "$NPM_CLI" view "@kissopen/kissopen-terminal@$RELEASE_VERSION" dist.integrity \
                      --registry https://registry.npmjs.org/ 2>/dev/null || true)"
                  if [[ -n "$published_integrity" ]]; then
                      tarball="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name '*.tgz' -print -quit)"
                      local_integrity="$(node -e 'process.stdout.write("sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
                      if [[ "$published_integrity" != "$local_integrity" ]]; then
                          echo "The published version differs from this verified artifact. Choose a new version." >&2
                          exit 1
                      fi
                      echo "The identical verified artifact is already on npm; completing its GitHub release."
                      echo "NPM_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
                  fi

            - name: Persist the verified package version on main
              shell: bash
              run: |
                  artifact_version="$(node -p "require('./release-assets/package.json').version")"
                  if [[ "$artifact_version" != "$RELEASE_VERSION" ]]; then
                      echo "The verified manifest contains $artifact_version instead of $RELEASE_VERSION." >&2
                      exit 1
                  fi

                  cp release-assets/package.json packages/kissopen-terminal/package.json
                  if git diff --quiet -- packages/kissopen-terminal/package.json; then
                      release_commit="$(git rev-parse HEAD)"
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add packages/kissopen-terminal/package.json
                      git commit -m "Release Kissopen Terminal v$RELEASE_VERSION"
                      git push origin HEAD:main
                      release_commit="$(git rev-parse HEAD)"
                  fi
                  echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"

            - name: Publish with npm trusted publishing
              if: env.NPM_ALREADY_PUBLISHED != 'true'
              shell: bash
              run: |
                  tarball="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name '*.tgz' -print -quit)"
                  if [[ -z "$tarball" ]]; then
                      echo "The verified npm tarball is missing." >&2
                      exit 1
                  fi

                  node "$NPM_CLI" publish "$tarball" \
                      --access public \
                      --tag latest \
                      --provenance \
                      --registry https://registry.npmjs.org/

            - name: Verify npm publication
              shell: bash
              run: |
                  published_version=""
                  # npm may process a successfully accepted package for several minutes.
                  for attempt in {1..180}; do
                      published_version="$(node "$NPM_CLI" view "@kissopen/kissopen-terminal@$RELEASE_VERSION" version \
                          --registry https://registry.npmjs.org/ 2>/dev/null || true)"
                      if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
                          break
                      fi
                      sleep 5
                  done
                  if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
                      echo "npm did not report @kissopen/kissopen-terminal@$RELEASE_VERSION after publication." >&2
                      exit 1
                  fi

            - name: Create the release tag and GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  mkdir -p .release
                  printf '%s\n' "$RELEASE_NOTES" > .release/notes.md
                  gh release create "$RELEASE_TAG" \
                      --target "$RELEASE_COMMIT" \
                      --title "Kissopen Terminal v$RELEASE_VERSION" \
                      --latest=false \
                      --notes-file .release/notes.md
                  release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
                  printf 'Published [Kissopen Terminal v%s](%s) and `@kissopen/kissopen-terminal@%s`.\n' \
                      "$RELEASE_VERSION" "$release_url" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
